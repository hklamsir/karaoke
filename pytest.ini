[pytest]
testpaths = tests
# 只收 tests/ —— 明確排除本機素材與交付產物，避免 pytest 掃到 60MB 的實測檔
norecursedirs = .venv .venv-ui _probe _smoke dist assets __pycache__ .git
markers =
    slow: 大數據量 / 長時測試（3 小時 doc、5,000 行 doc、真實 ffmpeg 燒錄）；可用 -m "not slow" 跳過
    integration: 需要真實外部程序（ffmpeg / ffprobe）的端到端測試
filterwarnings =
    default
