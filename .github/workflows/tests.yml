name: tests

# 目的（docs/代碼審查報告.html §2.2 / §9.4）：把「錯了也不報錯」的陷阱鎖在 CI 上。
# - ADR-005 時間格式寫錯 → libass 靜默輸出無字幕影片，只有測試能抓
# - ADR-006 燒錄路徑含冒號 → ffmpeg 靜默失敗
# - ADR-013 停頓雙倍 → 逐字高亮整體偏移

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝依賴
        # 用交付 lock 檔（==，含傳遞依賴）而唔係浮動 requirements*.txt：
        # CI 驗證的版本組合必須同用戶實際拿到的一致（審查報告 TL-S5）。
        # requirements-dev.txt 另外補 pytest 等測試工具；lock 已有的套件
        # pip 會自動判斷已滿足，唔會被 downgrade。
        # requirements-ui.txt 的內容（numpy / pygame / ttkbootstrap）已在 lock 內。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.txt

      - name: 安裝 FFmpeg
        # 必需的，唔係可選：現時 11 條 slow 測試（真實燒錄 ×4、大文件／原子寫入 ×7）
        # 當中需要 ffmpeg 的會 skip。初版誤以為 windows-latest 內建，
        # 實測會 skip 10 條 → CI 變假綠（首跑紀錄：56 passed, 10 skipped）。
        # 用 choco（runner 內建）而唔用第三方 action，減少供應鏈依賴。
        run: choco install ffmpeg -y --no-progress

      - name: 跑測試
        # -rf 讓失敗摘要列出原因；xfail 數量 = 待實作功能清單長度
        run: python -m pytest tests -v --tb=short -rf

      - name: 上傳測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: .pytest_cache/
          retention-days: 7
