name: tests

# 目的（docs/代碼審查報告.html §2.2 / §9.4）：把「錯了也不報錯」的陷阱鎖在 CI 上。
# - ADR-005 時間格式寫錯 → libass 靜默輸出無字幕影片，只有測試能抓
# - ADR-006 燒錄路徑含冒號 → ffmpeg 靜默失敗
# - ADR-013 停頓雙倍 → 逐字高亮整體偏移

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝依賴
        # requirements-ui.txt 一定要裝：ui.audio / ui.thumbs 在 module level
        # import numpy，唔裝就會令 test_audio_long 等 6 條變成 skip（假綠）。
        # pygame 由同一檔帶入（headless 下 mixer.init 會失敗並降級，唔影響測試）。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ui.txt -r requirements-dev.txt

      - name: 安裝 FFmpeg
        # 必需的，唔係可選：10 條測試（compare_sources ×6、真實燒錄 ×3、
        # 16kHz 抽音 ×1）沒有 ffmpeg 會 skip。初版誤以為 windows-latest 內建，
        # 實測會 skip 10 條 → CI 變假綠（首跑紀錄：56 passed, 10 skipped）。
        # 用 choco（runner 內建）而唔用第三方 action，減少供應鏈依賴。
        run: choco install ffmpeg -y --no-progress

      - name: 跑測試
        # -rf 讓失敗摘要列出原因；xfail 數量 = 待實作功能清單長度
        run: python -m pytest tests -v --tb=short -rf

      - name: 上傳測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: .pytest_cache/
          retention-days: 7
