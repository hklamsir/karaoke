<text class="ui t2" x="324" y="116" fill="#8a8a9c">以下參數表由 main.py 嘅 argparse 直接生成，唔會過時。</text>
<text class="ui" x="324" y="146" font-size="14" fill="#3AA0FF" font-weight="500">4.1 generate</text>

<text class="mono t" x="324" y="226" fill="#e6e6ec">-i, --input</text>
<text class="mono t" x="560" y="226" fill="#8a8a9c">必填</text>
<text class="ui t" x="660" y="226" fill="#8a8a9c">輸入 MV 影片路徑</text>

<text class="mono t" x="324" y="248" fill="#e6e6ec">-o, --output-dir</text>

<text class="ui t" x="660" y="248" fill="#8a8a9c">輸出資料夾（timings.json + ass）</text>
